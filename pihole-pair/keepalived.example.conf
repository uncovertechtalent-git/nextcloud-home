# keepalived for a pair of Pi-hole machines on one subnet. The same file on both,
# with the three lines marked CHANGE differing. Both machines answer DNS on their
# own address; the virtual address follows whichever machine is healthy.

vrrp_script chk_pihole {
    # Healthy while the DNS service runs. Two failed checks, two seconds apart,
    # take the machine out.
    script   "/usr/bin/systemctl is-active --quiet pihole-FTL"
    interval 2
    timeout  2
    rise     2
    fall     2
}

vrrp_instance VI_PIHOLE {
    state             MASTER            # CHANGE: BACKUP on the second machine
    interface         eth0              # CHANGE: the network interface of that machine
    virtual_router_id 51                # any 1-255 that nothing else on the subnet uses
    priority          110               # CHANGE: 100 on the second machine
    advert_int        1
    authentication {
        auth_type PASS
        auth_pass change-me             # same on both; 8 characters count
    }
    virtual_ipaddress {
        <virtual address>/24            # a free address on the subnet
    }
    track_script {
        chk_pihole
    }
}
