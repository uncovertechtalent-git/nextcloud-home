name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck -s bash backup/nextcloud-backup.sh
          shellcheck -s sh scripts/*.sh lan-proxy/scripts/*.sh
      - name: compose file parses with a fresh .env and fresh secrets
        run: |
          cp .env.example .env
          sh scripts/init-secrets.sh
          docker compose config -q
      - name: systemd units verify
        run: |
          sudo install -m 755 backup/nextcloud-backup.sh /usr/local/sbin/nextcloud-backup
          sudo install -m 755 pihole-pair/pihole-sync.py /usr/local/sbin/pihole-sync
          sudo install -d /etc/pihole-sync
          sudo install -m 644 pihole-pair/pihole-sync.env.example /etc/pihole-sync/sync.env
          systemd-analyze verify backup/nextcloud-backup.service backup/nextcloud-backup.timer \
            pihole-pair/pihole-sync.service pihole-pair/pihole-sync.timer
      - name: pihole-pair tests
        run: python3 -m unittest pihole-pair/test_pihole_sync.py
      - name: lan-proxy builds, compose parses, Caddyfile and examples validate
        run: |
          cd lan-proxy
          cp .env.example .env
          mkdir -p secrets sites
          printf 'AWS_REGION=us-east-1\n' > secrets/aws.env
          docker compose config -q
          cp sites.example/*.caddy sites/
          docker build -t lan-proxy-caddy:ci .
          docker run --rm -e LAN_DOMAIN=lan.example.org -e ROUTE53_ZONE_ID=ZXXXXXXXXXXXXX \
            -e ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/sites:/etc/caddy/sites:ro" \
            lan-proxy-caddy:ci caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" lan-proxy-caddy:ci caddy fmt --diff /etc/caddy/Caddyfile
